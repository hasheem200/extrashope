<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

       

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<script>
// يراقب ظهور أي عنصر toast جديد على الصفحة وينقله لفوق
// (احتياطي لو الـ CSS وحده مش كافي بسبب inline styles)
(function(){
    const forceTop = (el) => {
        if(!el || !el.style) return;
        el.style.top = "20px";
        el.style.bottom = "auto";
    };

    const observer = new MutationObserver((mutations) => {
        mutations.forEach((m) => {
            m.addedNodes.forEach((node) => {
                if(node.nodeType !== 1) return;
                const cls = (node.className || "").toString().toLowerCase();
                if(cls.includes("toast")){
                    forceTop(node);
                }
                if(node.querySelectorAll){
                    node.querySelectorAll('[class*="toast"]').forEach(forceTop);
                }
            });
        });
    });

    observer.observe(document.body, { childList:true, subtree:true });
})();
</script>

/* ============================================ */
/* دالة toast مخصصة تظهر أعلى الصفحة دايمًا */
/* (بتحل محل أي toast() جاية من ui-helpers.js) */
/* ============================================ */
function toast(message){

if(!message) return;

let box = document.getElementById("customToastBox");

if(!box){

box = document.createElement("div");
box.id = "customToastBox";

box.style.position = "fixed";
box.style.top = "20px";
box.style.left = "50%";
box.style.transform = "translateX(-50%)";
box.style.zIndex = "999999";
box.style.background = "#1c1c1c";
box.style.color = "#fff";
box.style.padding = "12px 24px";
box.style.borderRadius = "8px";
box.style.fontSize = "14px";
box.style.boxShadow = "0 4px 14px rgba(0,0,0,.25)";
box.style.maxWidth = "90%";
box.style.textAlign = "center";
box.style.transition = "opacity .3s, top .3s";
box.style.opacity = "0";

document.body.appendChild(box);

}

box.textContent = message;
box.style.top = "20px";
box.style.opacity = "1";

clearTimeout(box._hideTimer);

box._hideTimer = setTimeout(() => {
box.style.opacity = "0";
}, 3000);

}

/* رفع صورة واحدة (Logo أو Banner) مع إظهار الخطأ الحقيقي لو فشل */
async function uploadImage(file, label){

const formData =
new FormData();

formData.append(
"image",
file
);

const token =
localStorage.getItem("token");

let upload;

try{

upload = await fetch(
"/api/upload",
{
method:"POST",
headers: token
? { "Authorization": "Bearer " + token }
: {},
body:formData
}
);

}catch(networkErr){

console.error(`❌ ${label} upload network error:`, networkErr);
toast(`❌ Connection failed while uploading ${label}`);
return null;

}

if(!upload.ok){

const errText = await upload.text().catch(()=> "");
console.error(`❌ ${label} upload failed:`, upload.status, errText);
toast(`❌ Failed to upload ${label} (code ${upload.status})`);
return null;

}

const result =
await upload.json().catch(()=>null);

if(!result || !result.image){

console.error(`❌ ${label} upload: unexpected response`, result);
toast(`❌ Unexpected response while uploading ${label}`);
return null;

}

return result.image;

}
