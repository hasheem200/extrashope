<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seller Products</title>

<!-- ============================================ -->
<!-- كود يعمل على أي صفحة: Favicon + Site Name in Title -->
<!-- ضع هذا الكود داخل <head> في أي صفحة HTML -->
<!-- ============================================ -->

<title>Loading...</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        injectCustomHtml(s.headHtml, s.footerHtml);

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none';"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet"
href="style2.css">

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
⚙️ Shop Settings
</div>

<nav>

<a href="/">🌍 View Store</a>
<a href="/">📲 Telegram Notifications</a>
<a href="/">⚙ Shop Settings</a>
<a href="/">✔ Verification</a>
<a href="/">📢 Promotions</a>
<a href="/">⭐ Reviews</a>
<a href="/">💬 Order Chats</a>
<a href="seller-products">My Orders</a>
<a href="seller-dashboard">Dashboard</a>

</nav>

</header>




<div class="admin-product">

<h2>⚙️ Shop Settings</h2>

<div class="settings-row">

<div class="form-box">
<label>Shop Name *</label>
<input
type="text"
id="storeName"
placeholder="Top Movies">
</div>

<div class="form-box">
<label>Shop Description</label>
<textarea
id="storeDescription"
rows="4"
placeholder="Describe your store..."></textarea>
</div>

</div>

<div>
<label>Shop URL</label>
<input id="shopUrl" readonly>
</div>

<div>
<label>Shop Logo</label>
<input type="file" id="logoFile">
</div>

<div>
<label>Shop Banner</label>
<input type="file" id="bannerFile">
</div>

<div class="shop-buttons">

<button onclick="saveSettings()">
💾 Save Changes
</button>


<button onclick="viewStore()">
🌍 View Store
</button>


</div>

</div>


<script>
function viewStore(){

const user =
JSON.parse(
localStorage.getItem("user")
);

window.open(
"/store.html?seller=" +
user.nickname,
"_blank"
);

}

/*
  BUG FIX: this function was being called (see bottom of this
  script) but never actually existed anywhere — meaning it threw
  "loadSettings is not defined" the moment the page loaded, and
  the form always started blank. Worse, because nothing loaded the
  seller's CURRENT storeLogo/storeBanner, saveSettings() below had
  no way to know what they were — every save silently wiped out
  the existing logo/banner unless you happened to re-upload both
  every single time.
*/

let currentLogoUrl = "";
let currentBannerUrl = "";

async function loadSettings(){

const user =
JSON.parse(
localStorage.getItem("user")
);

if(!user) return;

document.getElementById("shopUrl").value =
window.location.origin + "/store?seller=" + user.nickname;

try{

const res =
await fetch("/api/users/store/" + encodeURIComponent(user.nickname));

if(!res.ok) return;

const store =
await res.json();

document.getElementById("storeName").value =
store.storeName || "";

document.getElementById("storeDescription").value =
store.storeDescription || "";

currentLogoUrl = store.storeLogo || "";
currentBannerUrl = store.storeBanner || "";

}catch(err){

console.log("Could not load current store settings:", err);

}

}

async function saveSettings(){

const user =
JSON.parse(
localStorage.getItem("user")
);

// default to whatever was already saved — only overwritten below
// if a new file was actually chosen, so editing just the name/
// description no longer erases the existing logo/banner
let logoUrl = currentLogoUrl;

let bannerUrl = currentBannerUrl;

/* LOGO */

const logo =
document.getElementById(
"logoFile"
).files[0];

if(logo){

const formData =
new FormData();

formData.append(
"image",
logo
);

const upload =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const result =
await upload.json();

// BUG FIX: if this upload failed, "result.image" is undefined —
// used to overwrite logoUrl with that undefined value (wiping out
// the existing logo, since JSON.stringify drops undefined keys
// and the backend then treats it as blank). Now it keeps the
// current logo and tells the seller the upload didn't work.
if(!upload.ok || !result.image){

toast(result.message || "Logo upload failed — keeping your current logo.", "error");

}else{

logoUrl =
result.image;

}

}

/* BANNER */

const banner =
document.getElementById(
"bannerFile"
).files[0];

if(banner){

const formData =
new FormData();

formData.append(
"image",
banner
);

const upload =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const result =
await upload.json();

// Same fix as the logo above — a failed upload no longer wipes
// out the existing banner.
if(!upload.ok || !result.image){

toast(result.message || "Banner upload failed — keeping your current banner.", "error");

}else{

bannerUrl =
result.image;

}

}

/* SAVE STORE */

const res =
await fetch(

"/api/users/store/" +
user.nickname,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

storeName:
document.getElementById(
"storeName"
).value,

storeDescription:
document.getElementById(
"storeDescription"
).value,

storeLogo:
logoUrl,

storeBanner:
bannerUrl

})

}

);

const data =
await res.json();

if(res.ok){
    currentLogoUrl = logoUrl;
    currentBannerUrl = bannerUrl;
}

toast(data.message);

}

loadSettings();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("seller");
</script>
</body>

</html>
