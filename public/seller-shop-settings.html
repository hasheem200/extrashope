<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seller Products</title>

<!-- ============================================ -->
<!-- كود يعمل على أي صفحة: Favicon + Site Name in Title -->
<!-- ضع هذا الكود داخل <head> في أي صفحة HTML -->
<!-- ============================================ -->

<title>Loading...</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

    

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>



<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>

<!-- تنسيق إضافي لترتيب صفحة إعدادات المتجر -->

<style>
    body{
        background:#f4f5f7;
        font-family:Arial, Helvetica, sans-serif;

    header{
        display:flex;
        align-items:center;
        justify-content:space-between;

    }

    }

    .admin-product{
        max-width:800px;

    .admin-product > div:not(.settings-row):not(.shop-buttons){

    }

    .form-box{
        display:flex;
        flex-direction:column;
    }

    label{
        font-weight:600;
        margin-bottom:6px;
        font-size:14px;
        color:#333;
    }

    input[type="text"],
    input#storeName,
    input#shopUrl,

        border:1px solid #ccc;

        outline:none;
    }

    }

        border-radius:8px;

    }

    .shop-buttons{
        display:flex;
        gap:12px;
        margin-top:10px;
    }

        border:none;
        border-radius:8px;

    @media (max-width: 600px){

</style>

<body>

<header>

<div class="logo">
⚙️ Shop Settings
</div>

<nav>


<a href="seller-dashboard" class="back">
⬅ Back 
</a>


</nav>

</header>




<div class="admin-product">

<h2>⚙️ Shop Settings</h2>

<div class="settings-row">

<div class="form-box">
<label>Shop Name *</label>
<input
type="text"
id="storeName"
placeholder="Top Movies">
</div>

<div class="form-box">
<label>Shop Description</label>
<textarea
id="storeDescription"
rows="4"
placeholder="Describe your store..."></textarea>
</div>

</div>

<div>
<label>Shop URL</label>
<input id="shopUrl" readonly>
</div>

<div>
<label>Shop Logo</label>
<input type="file" id="logoFile">
</div>

<div>
<label>Shop Banner</label>
<input type="file" id="bannerFile">
</div>

<div class="shop-buttons">

<button onclick="saveSettings()">
💾 Save Changes
</button>


<button onclick="viewStore()">
🌍 View Store
</button>


</div>

</div>


<script>
function viewStore(){

const user =
JSON.parse(
localStorage.getItem("user")
);

window.open(
"/store.html?seller=" +
user.nickname,
"_blank"
);

}

async function saveSettings(){

const user =
JSON.parse(
localStorage.getItem("user")
);

let logoUrl =
localStorage.getItem("storeLogo") || "";

let bannerUrl =
localStorage.getItem("storeBanner") || "";

/* LOGO */

const logo =
document.getElementById(
"logoFile"
).files[0];

if(logo){

const formData =
new FormData();

formData.append(
"image",
logo
);

const upload =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const result =
await upload.json();

logoUrl =
result.image;

}

/* BANNER */

const banner =
document.getElementById(
"bannerFile"
).files[0];

if(banner){

const formData =
new FormData();

formData.append(
"image",
banner
);

const upload =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const result =
await upload.json();

bannerUrl =
result.image;

}

/* SAVE STORE */

const res =
await fetch(

"/api/users/store/" +
user.nickname,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

storeName:
document.getElementById(
"storeName"
).value,

storeDescription:
document.getElementById(
"storeDescription"
).value,

storeLogo:
logoUrl,

storeBanner:
bannerUrl

})

}

);

const data =
await res.json();

toast(data.message);

}

loadSettings();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("seller");
</script>
</body>

</html>
