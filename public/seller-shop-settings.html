<script>
async function applySiteSettings() {
    try {
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        const currentTitle = document.title;
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

);

}

/* رفع صورة واحدة (Logo أو Banner) مع إظهار الخطأ الحقيقي لو فشل */
async function uploadImage(file, label){

const formData =
new FormData();

formData.append(
"image",
file
);

const token =
localStorage.getItem("token");

let upload;

try{

upload = await fetch(
"/api/upload",
{
method:"POST",
headers: token
? { "Authorization": "Bearer " + token }
: {},
body:formData
}
);

}catch(networkErr){

console.error(`❌ ${label} upload network error:`, networkErr);
toast(`❌ فشل الاتصال أثناء رفع ${label}`);
return null;

}

if(!upload.ok){

const errText = await upload.text().catch(()=> "");
console.error(`❌ ${label} upload failed:`, upload.status, errText);
toast(`❌ فشل رفع ${label} (كود ${upload.status})`);
return null;

}

const result =
await upload.json().catch(()=>null);

if(!result || !result.image){

console.error(`❌ ${label} upload: unexpected response`, result);
toast(`❌ استجابة غير متوقعة عند رفع ${label}`);
return null;

}

return result.image;

}

async function saveSettings(){

const user =
JSON.parse(
localStorage.getItem("user")
);

let logoUrl =
localStorage.getItem("storeLogo") || "";

let bannerUrl =
localStorage.getItem("storeBanner") || "";

/* LOGO */

const logo =
document.getElementById(
"logoFile"
).files[0];

if(logo){

const uploaded = await uploadImage(logo, "Shop Logo");

if(uploaded){
logoUrl = uploaded;
localStorage.setItem("storeLogo", logoUrl);
}

}

/* BANNER */

const banner =
document.getElementById(
"bannerFile"
).files[0];

if(banner){

const uploaded = await uploadImage(banner, "Shop Banner");

if(uploaded){
bannerUrl = uploaded;
localStorage.setItem("storeBanner", bannerUrl);
}

}

/* SAVE STORE */

let res;

try{

res = await fetch(

"/api/users/store/" +
user.nickname,

{
method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

storeName:
document.getElementById(
"storeName"
).value,

storeDescription:
document.getElementById(
"storeDescription"
).value,

storeLogo:
logoUrl,

storeBanner:
bannerUrl

})

}

);

}catch(networkErr){

console.error("❌ Save settings network error:", networkErr);
toast("❌ فشل الاتصال بالسيرفر");
return;

}

if(!res.ok){

const errText = await res.text().catch(()=> "");
console.error("❌ Save settings failed:", res.status, errText);
toast(`❌ فشل حفظ الإعدادات (كود ${res.status})`);
return;

}

const data =
await res.json().catch(()=>null);
