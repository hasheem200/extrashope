<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        injectCustomHtml(s.headHtml, s.footerHtml);

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none';"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<script>

async function loadCommission(){

    const res = await fetch("/api/settings");

    const settings = await res.json();

    document.getElementById("commissionPercent").value =
        settings.commission;

    document.getElementById("adsRevenue").innerText =
        "$" + Number(settings.adsRevenue || 0).toFixed(2);    

}

async function saveCommission(){

    const commission =
        document.getElementById("commissionPercent").value;

    await fetch("/api/settings",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            commission
        })

    });

    toast("Commission Updated ✅");

}

loadCommission();


function loadWithdraws(){

const withdraws =
JSON.parse(localStorage.getItem("withdraws")) || [];

const container =
document.getElementById("withdrawsContainer");

container.innerHTML = "";

withdraws.forEach((item,index)=>{

container.innerHTML += `

<div class="admin-product">

<div>

<h2>$${item.amount}</h2>

<p>${item.method}</p>

<p>${item.status}</p>

</div>

<button onclick="approveWithdraw(${index})">

Approve

</button>

<button onclick="rejectWithdraw(${index})">

Reject

</button>

</div>

`;

});

}

function approveWithdraw(index){

let withdraws =
JSON.parse(localStorage.getItem("withdraws")) || [];

withdraws[index].status =
"Approved ✅";

localStorage.setItem(
"withdraws",
JSON.stringify(withdraws)
);

loadWithdraws();

}

function rejectWithdraw(index){

let withdraws =
JSON.parse(localStorage.getItem("withdraws")) || [];

withdraws[index].status =
"Rejected ❌";

localStorage.setItem(
"withdraws",
JSON.stringify(withdraws)
);

loadWithdraws();

}

loadWithdraws();

async function editProduct(id){

const name =
prompt("New Product Name");

const price =
prompt("New Price");

await fetch(

"/api/products/" + id,

{
method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name,
price

})

}

);

toast("Product Updated ✔");

loadProducts();

}

async function loadStats(){

    // buyers & sellers
    const statsRes = await fetch("/api/admin/stats");
    const stats = await statsRes.json();

    document.getElementById("buyersCount").innerText = stats.buyers;
    document.getElementById("sellersCount").innerText = stats.sellers;

    // pending withdraws
    const withdrawRes = await fetch("/api/withdraws");
    const withdraws = await withdrawRes.json();

    const pending = withdraws.filter(
        w => w.status === "Pending ⏳"
    );

    document.getElementById("pendingWithdrawsCount").innerText =
        pending.length;
}



/* LOAD PRODUCTS */

async function loadProducts(){

const res =
await fetch("/api/products");

const products =
await res.json();

document.getElementById(
"productsCount"
).innerText = products.length;

const container =
document.getElementById(
"productsContainer"
);

container.innerHTML = "";

products.forEach(product=>{

container.innerHTML += `

<div class="admin-product">

<img loading="lazy" src="${product.image}">

<div>

<h2>${product.name}</h2>

<p>$${product.price}</p>

<p>${product.type}</p>

</div>


<button onclick="editProduct('${product._id}')">
Edit
</button>

<button onclick="deleteProduct('${product._id}')">
Delete
</button>

</div>

`;

});

}

}

async function loadSellers(){

await fetch("/api/users");

const users =
await res.json();

users.filter(user => user.role === "seller");

const container =
document.getElementById("sellersContainer");

container.innerHTML = "";

sellers.forEach(user=>{

container.innerHTML += `

<div class="admin-product">

<div>

<h2>${user.nickname}</h2>

<p>${user.email}</p>

</div>

<button onclick="verifySeller('${user._id}')">
Verify
</button>

<button onclick="banSeller('${user._id}')">
Ban
</button>

`;

});

}

async function addSeller(){

const nickname =
document.getElementById("sellerName").value;

const email =
document.getElementById("sellerEmail").value;

const password =
document.getElementById("sellerPassword").value;

const res = await fetch(
"/api/users/register",
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nickname,
email,
password,
role:"seller"

})

}
);

const data = await res.json();

toast(data.message);

loadSellers();

}

"ordersContainer"
);

container.innerHTML = "";

orders.forEach(order=>{

container.innerHTML += `

<div>

${order.customer || order.userName || "Unknown User"}
</h2>

${order.status !== "Completed ✅" ? `

<button onclick="
completeOrder('${order._id}')
">
Complete
</button>

` : ""}

`;

});

}

"/api/orders/" + id,

{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

status:"Completed ✅"

})

}

);

async function loadAdsStats(){

        pending.length;

let lastCount = 0;

async function checkWithdraws(){

  const res = await fetch("/api/withdraws/admin/all");
  const data = await res.json();

  const pending =
    data.filter(w => w.status === "Pending ⏳");

  if(lastCount && pending.length > lastCount){
    toast("💸 New Withdraw Request");
  }

  lastCount = pending.length;
}
