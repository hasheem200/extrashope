<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Promotions</title>

<!-- ============================================ -->
<!-- كود يعمل على أي صفحة: Favicon + Site Name in Title -->
<!-- ضع هذا الكود داخل <head> في أي صفحة HTML -->
<!-- ============================================ -->

<title>Loading...</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Shop";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

      

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
📢 Promotions
</div>

<nav>

<a href="seller-dashboard" class="back">⬅ Back To Dashboard</a>

</nav>

</header>

<div class="container">

<h1>Promote Your Products</h1>

<div id="products"></div>

</div>

<script>

const user =
JSON.parse(
localStorage.getItem("user")
);

async function loadProducts(){

const res =
await fetch("/api/products");

const products =
await res.json();

const myProducts =
products.filter(
p => p.seller === user.nickname
);

const container =
document.getElementById("products");

container.innerHTML = "";

if(myProducts.length === 0){

container.innerHTML =
"<p>No products found.</p>";

return;

}

myProducts.forEach(product => {

container.innerHTML += `

<div class="card">

<img
src="${product.image}"
width="120">

<h3>${product.name}</h3>

<p>$${product.price}</p>

${
product.promoted &&
product.promotionEnd
?

`<p style="color:lime;">
🔥 Promoted
</p>`

:

""
}

<button onclick="
promote(
'${product._id}',
3,
5
)">
🔥 3 Days ($5)
</button>

<button onclick="
promote(
'${product._id}',
7,
10
)">
🔥 7 Days ($10)
</button>

<button onclick="
promote(
'${product._id}',
30,
25
)">
🔥 30 Days ($25)
</button>

</div>

`;

});

}

async function promote(
productId,
days,
price
){

if(
!confirm(
`Promote for ${days} days?\nCost: $${price}`
)
){
return;
}

const pay = await fetch(
"/api/users/promote",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

seller:
user.nickname,

amount:
price

})

}
);

const payData =
await pay.json();

if(!payData.success){

toast(
payData.message
);

return;

}

const promote =
await fetch(

"/api/products/promote/" +
productId,

{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

days

})

}

);

const data =
await promote.json();

toast(data.message);

loadProducts();

}

loadProducts();

</script>

<script src="js/auth.js"></script>

<script>
requireRole("seller");
</script>

</body>

</html>
