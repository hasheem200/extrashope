<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Details</title>  <!-- مؤقت -->

<!-- ✅ رابط الـ Favicon الافتراضي (سيتم تحديثه عبر JavaScript) -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// 1️⃣ تحديث عنوان الصفحة: اسم المنتج - اسم الموقع
// 2️⃣ تحديث الـ Favicon من الإعدادات
// 3️⃣ تحديث اسم الموقع في الهيدر
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};

        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                // إذا لم يوجد الرابط، أنشئ واحداً
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث اسم الموقع في الهيدر
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            // إذا كان يوجد صورة في الأيقونة
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        // 4. جلب اسم المنتج من الـ URL
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        if (!productId) {
            document.title = `Product - ${siteName}`;
            return;
        }

        // 5. جلب بيانات المنتج
        const productsRes = await fetch("/api/products");
        const products = await productsRes.json();
        const localProducts = JSON.parse(localStorage.getItem("sellerProducts")) || [];
        const allProducts = [...products, ...localProducts];
        const product = allProducts.find(p => p.id == productId);

        // 6. تحديث عنوان الصفحة
        if (product && product.name) {
            document.title = `${product.name} - ${siteName}`;

            setSeoTags({
                title: document.title,
                description: `${product.name}${product.category ? " — " + product.category : ""} on ${siteName}`,
                image: product.image || "",
                siteName: siteName,
                type: "product"
            });

        } else {
            document.title = `Product - ${siteName}`;
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        document.title = "Product - My Site";
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
🛒 Product Details
</div>


<nav>
<a href="/">Home</a>
<a href="cart">Cart</a>
<a href="wishlist">Wishlist</a>
</nav>

</header>

<div class="product-page" id="productPage"></div>



<script>


const params =
new URLSearchParams(window.location.search);

const productId = params.get("id");

/* LOAD PRODUCT */

async function loadProduct(){

const apiProducts =
await fetch("/api/products")
.then(res => res.json());

const localProducts =
JSON.parse(localStorage.getItem("sellerProducts")) || [];

const products =
[...apiProducts, ...localProducts];

const product =
products.find(p => p.id == productId);

// جلب البائع
const seller =
await fetch("/api/users/" + encodeURIComponent(product.seller))
.then(r => r.ok ? r.json() : null);

// هل البائع محظور؟
const sellerBlocked =
seller &&
seller.blocked &&
(
    seller.blockUntil === null ||
    new Date(seller.blockUntil) > new Date()
);

let blockHtml = "";

if(sellerBlocked){

    let remain = "";

    if(seller.blockUntil){

        const diff =
        new Date(seller.blockUntil) - new Date();

        remain =
        Math.ceil(diff / 86400000);

    }

    blockHtml = `
    <div style="
    background:#3b0000;
    color:#fff;
    padding:15px;
    border-radius:10px;
    margin:15px 0;
    border:1px solid red;
    ">

    <h3>🚫 Seller Account Suspended</h3>

    <p>
    ${seller.blockReason || "This seller is temporarily suspended."}
    </p>

    ${
    seller.blockUntil
    ?
    `<b>Remaining:</b> ${remain} Day(s)`
    :
    `<b>Permanent Suspension</b>`
    }

    </div>
    `;

}

const div =
document.getElementById("productPage");

const stockCount =
(product.stockData || "")
.split("\n")
.filter(line => line.trim())
.length;


div.innerHTML = `

<div class="product-details">

<img loading="lazy" src="${product.image}">

<div class="details">

<h1>${product.name}</h1>

<p class="price">
💲 ${product.price}
</p>

<p>
🏪 Seller:
<a href="store?seller=${product.seller}">
${product.seller}
</a>
</p>

<p>
📦 Type:
${product.type}
</p>

${
product.category === "Instagram" ||
product.category === "Facebook" ||
product.category === "Google" ||
product.category === "TikTok" ||
product.category === "Discord" ||
product.category === "Github" ||
product.category === "Accounts Game"

?

`<p style="
color:${stockCount > 0 ? 'green' : 'red'};
font-weight:bold;
">
📦 Stock: ${stockCount}
</p>`

:

""
}

${
sellerBlocked
?

`<button
disabled
style="
background:#b71c1c;
cursor:not-allowed;
opacity:.8;
">
🚫 Seller Suspended
</button>`

:

(
(
product.category === "Instagram" ||
product.category === "Facebook" ||
product.category === "Google" ||
product.category === "TikTok" ||
product.category === "Discord" ||
product.category === "Github" ||
product.category === "Accounts Game"
)
&&
(product.stockData || "")
.split("\n")
.filter(line => line.trim())
.length <= 0
)

?

`<button
disabled
style="
background:red;
cursor:not-allowed;
">
Out Of Stock
</button>`

:

`<button onclick='addToCart(${JSON.stringify(product)})'>
Add To Cart
</button>`
}



<button onclick="followSeller()"
class="follow-btn">

⭐ Follow Seller

</button>

<p id="followersCount">
0 Followers
</p>

${blockHtml}

<hr>

<h2>⭐ Store Rating</h2>

<div id="stars">

<span onclick="rateStore(1)">⭐</span>
<span onclick="rateStore(2)">⭐</span>
<span onclick="rateStore(3)">⭐</span>
<span onclick="rateStore(4)">⭐</span>
<span onclick="rateStore(5)">⭐</span>

</div>

<p id="ratingResult">
No ratings yet
</p>

<hr>

<h2>
Customer Reviews 💬
</h2>

<div id="reviewsContainer"></div>

<textarea
id="reviewText"
placeholder="Write review...">
</textarea>

<select id="reviewStars">

<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>

</select>

<button onclick="addReview()">
Submit Review
</button>

<hr>

<h2>
Live Chat 💬
</h2>

<div id="chatMessages"></div>

<input type="text"
id="chatInput"
placeholder="Write message...">

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

`;

showRating();

loadReviews();

loadMessages();

showFollowers();

}

/* ADD TO CART */

function addToCart(product){

const stockCount =
(product.stockData || "")
.split("\n")
.filter(line => line.trim())
.length;

if(
(
product.category === "Instagram" ||
product.category === "Facebook" ||
product.category === "Google" ||
product.category === "TikTok" ||
product.category === "Discord" ||
product.category === "Github" ||
product.category === "Accounts Game"
)
&&
stockCount <= 0
)

{
toast("Out Of Stock");
return;
}

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

cart.push(product);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

toast(product.name + " added to cart");

}


/* RATING */

function rateStore(stars){

let ratings =
JSON.parse(localStorage.getItem("ratings")) || [];

ratings.push(stars);

localStorage.setItem(
"ratings",
JSON.stringify(ratings)
);

showRating();

}

function showRating(){

let ratings =
JSON.parse(localStorage.getItem("ratings")) || [];

const result =
document.getElementById("ratingResult");

if(!result) return;

if(ratings.length === 0){

result.innerText =
"No ratings yet";

return;

}

const total =
ratings.reduce((a,b)=>a+b,0);

const average =
(total / ratings.length).toFixed(1);

result.innerText =
average + " ⭐ from " +
ratings.length + " users";

}

/* REVIEWS */

async function loadReviews(){

const container =
document.getElementById("reviewsContainer");

container.innerHTML = "";

const res =
await fetch("/api/reviews/" + productId);

const reviews =
await res.json();

if(reviews.length === 0){

container.innerHTML =
"<p>No reviews yet</p>";

return;

}

reviews.forEach(review=>{

container.innerHTML += `

<div class="review">

<h4>
${review.user}
${"⭐".repeat(review.stars)}
</h4>

<p>${review.text}</p>

<p>🕒 ${new Date(review.createdAt).toLocaleString()}</p>

</div>

`;

});

}

async function addReview(){

const text =
document.getElementById("reviewText").value;

const stars =
document.getElementById("reviewStars").value;

const user =
JSON.parse(localStorage.getItem("user"));

if(!user){

toast("Login First");

return;

}

const apiProducts =
await fetch("/api/products")
.then(r=>r.json());

const product =
apiProducts.find(p=>p.id==productId);

await fetch("/api/reviews",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

productId,

seller:product.seller,

user:user.nickname,

stars,

text

})

});

document.getElementById("reviewText").value="";

loadReviews();

toast("Review Added");

}


/* CHAT */

function loadMessages(){

const chat =
document.getElementById("chatMessages");

if(!chat) return;

let messages =
JSON.parse(localStorage.getItem("messages")) || [];

chat.innerHTML = "";

messages.forEach(msg => {

chat.innerHTML += `

<div class="message">

<h4>
👤 ${msg.user}
</h4>

<p>
${msg.text}
</p>

</div>

`;

});

}

function sendMessage(){

const input =
document.getElementById("chatInput");

const user =
JSON.parse(localStorage.getItem("user"));

if(!user){

toast("Login First");

return;

}

if(input.value.trim() === "") return;

let messages =
JSON.parse(localStorage.getItem("messages")) || [];

messages.push({

user: user.nickname,

text: input.value

});

localStorage.setItem(
"messages",
JSON.stringify(messages)
);

input.value = "";

loadMessages();

}

/* FOLLOW */

function followSeller(){

let followers =
Number(localStorage.getItem("followers")) || 0;

followers++;

localStorage.setItem(
"followers",
followers
);

showFollowers();

toast("Seller Followed ⭐");

}

function showFollowers(){

const count =
document.getElementById("followersCount");

if(!count) return;

let followers =
localStorage.getItem("followers") || 0;

count.innerText =
followers + " Followers";

}



/* START */


// ============================================
// تحديث عنوان الصفحة: اسم المنتج - اسم الموقع
// ============================================
async function updateProductTitle() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const siteName = settingsData.siteSettings?.siteName || "My Shop";

        // 2. جلب ID المنتج من الـ URL
        const params = new URLSearchParams(window.location.search);
        const productId = params.get("id");

        if (!productId) {
            document.title = `Product - ${siteName}`;
            return;
        }

        // 3. جلب بيانات المنتج
        const productsRes = await fetch("/api/products");
        const products = await productsRes.json();
        
        // البحث عن المنتج (مع دعم المنتجات المحلية)
        const localProducts = JSON.parse(localStorage.getItem("sellerProducts")) || [];
        const allProducts = [...products, ...localProducts];
        const product = allProducts.find(p => p.id == productId);

        
        // 4. تحديث العنوان
        if (product && product.name) {
            document.title = `${product.name} - ${siteName}`;
        } else {
            document.title = `Product - ${siteName}`;
        }

        console.log(`✅ Title updated: ${document.title}`);

    } catch (error) {
        console.error('❌ Failed to update title:', error);
        document.title = "Product - My Shop";
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', updateProductTitle);

showRating();

loadReviews();

loadMessages();

showFollowers();
loadProduct();


</script>

</body>
</html>
