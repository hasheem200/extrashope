<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Support Chat</title>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>
<body>

<header>

<h4>💬 Support Chat</h4>

</header>


<div class="checkout-page">

<input
id="subject"
type="text"
placeholder="Subject">

<textarea
id="message"
placeholder="Write your message..."
style="height:150px;"></textarea>

<button onclick="sendMessage()">
Send Message
</button>



<hr>

<h2>Your Messages</h2>

<div id="messages"></div>

</div>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f3f4f6;
height:100vh;
display:flex;
flex-direction:column;
}

/* HEADER */

header{
height:70px;
background:#111827;
color:white;
display:flex;
align-items:center;
padding:0 25px;
font-size:24px;
font-weight:bold;
}

/* CHAT */

.chat-wrapper{

width:900px;
max-width:95%;

margin:auto;

height:88vh;

background:white;

border-radius:15px;

display:flex;

flex-direction:column;

overflow:hidden;

box-shadow:0 10px 25px rgba(0,0,0,.15);

}

/* INFO */

.chat-info{

padding:20px;

border-bottom:1px solid #eee;

background:#fafafa;

}

.chat-info h2{

font-size:20px;

margin-bottom:5px;

}

.status{

font-weight:bold;

color:#16a34a;

}

/* MESSAGES */

.messages{

flex:1;

overflow-y:auto;

padding:20px;

background:#f5f5f5;

display:flex;

flex-direction:column;

gap:15px;

}

.message{

max-width:75%;

padding:15px;

border-radius:15px;

font-size:15px;

line-height:1.5;

word-wrap:break-word;

}

.user{

align-self:flex-start;

background:#dbeafe;

}

.admin{

align-self:flex-end;

background:#dcfce7;

}

/* SEND */

.send-box{

display:flex;

padding:20px;

background:white;

border-top:1px solid #eee;

gap:10px;

}

.send-box textarea{

flex:1;

height:70px;

padding:12px;

resize:none;

border:1px solid #ddd;

border-radius:10px;

outline:none;

}

.send-box button{

width:170px;

border:none;

background:#f59e0b;

color:white;

font-size:17px;

border-radius:10px;

cursor:pointer;

transition:.3s;

}

.send-box button:hover{

background:#d97706;

}

/* CLOSED */

.closed{

padding:20px;

text-align:center;

background:#fef2f2;

color:red;

font-weight:bold;

}

</style>













<script>

const user =
JSON.parse(localStorage.getItem("user"));

async function sendMessage(){

const subject =
document.getElementById("subject").value;

const message =
document.getElementById("message").value;

if(subject==="" || message===""){

toast("Complete all fields");

return;

}

console.log(user);
console.log(user.nickname);

await fetch("/api/support",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

seller:user.nickname,

role: user.role,

subject,

message

})

});

document.getElementById("subject").value="";
document.getElementById("message").value="";

loadSupport();

}

async function loadSupport(){

    const res = await fetch("/api/support");
    const tickets = await res.json();

    const myTickets = tickets.filter(t => t.seller === user.nickname);

    const box = document.getElementById("messages");

    box.innerHTML = "";

    myTickets.forEach(ticket=>{

        box.innerHTML += `
        <div class="message user">
            <b>${ticket.subject}</b><br>
            ${ticket.message}
        </div>
        `;

        if(ticket.reply){

            box.innerHTML += `
            <div class="message admin">
                ${ticket.reply}
            </div>
            `;

        }

    });

}

loadSupport();

setInterval(loadSupport,3000);



</script>

</body>
</html>
