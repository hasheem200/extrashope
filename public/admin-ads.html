<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Ads</title>

<link rel="stylesheet" href="style.css">

<style>

.container{
width:1100px;
max-width:95%;
margin:40px auto;
}

.card{

background:white;

padding:20px;

margin-bottom:20px;

border-radius:10px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

img{
max-width:350px;
border-radius:8px;
margin:15px 0;
}

button{

padding:12px 25px;

margin-right:10px;

border:none;

border-radius:8px;

cursor:pointer;

}

.approve{
background:#22c55e;
color:white;
}

.reject{
background:#ef4444;
color:white;
}

</style>

</head>

<body>

<header>

<div class="logo">
📢 Advertisement Manager
</div>

<nav>
<a href="admin.html">← Back</a>
</nav>

</header>

<div class="container" id="adsContainer">

Loading...

</div>

<div id="imageModal" style="
display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
justify-content:center;
align-items:center;
z-index:9999;
">

<img id="modalImage" style="
max-width:90%;
max-height:90%;
border-radius:10px;
">

</div>

<script>

async function loadAds(){

    const res = await fetch("/api/ads");

    const ads = await res.json();

    const box =
    document.getElementById("adsContainer");

    box.innerHTML="";

    ads
.filter(ad => !ad.status.startsWith("Approved"))
.filter(ad => !ad.status.startsWith("Rejected"))
.forEach(ad=>{

        box.innerHTML += `

<div class="card">

<h2>${ad.advertiser}</h2>

<p><b>Banner:</b> ${ad.bannerType}</p>

<p><b>Website:</b> ${ad.website}</p>

<p><b>Days:</b> ${ad.days}</p>

<p><b>Price:</b> $${ad.price}</p>

<p><b>Status:</b> ${ad.status}</p>

<h3>Banner</h3>

<img
class="preview"
src="${ad.bannerImage}"
onclick="openImage('${ad.bannerImage}')">

<h3>Payment Proof</h3>

<img
class="preview"
src="${ad.paymentProof}"
onclick="openImage('${ad.paymentProof}')">

<br><br>

<button class="approve"
onclick="approve('${ad._id}')">

Approve

</button>

<button class="reject"
onclick="reject('${ad._id}')">

Reject

</button>

</div>

`;

    });

    ads.forEach(ad=>{
    console.log(ad.status);
});

}

async function approve(id){

    await fetch("/api/ads/"+id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            status:"Approved"

        })

    });

    loadAds();

}

async function reject(id){

    await fetch("/api/ads/"+id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            status:"Rejected"

        })

    });

    loadAds();

}

loadAds();

function openImage(src){

    document.getElementById("imageModal").style.display="flex";

    document.getElementById("modalImage").src=src;

}

document.getElementById("imageModal").onclick=function(){

    this.style.display="none";

}

</script>

</body>
</html>
