<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uploads Manager</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#111;
color:white;
font-family:Arial;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:15px;
flex-wrap:wrap;
gap:10px;
}

.toolbar{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
align-items:center;
}

.toolbar input[type="text"]{
padding:8px 12px;
border-radius:6px;
border:1px solid #333;
background:#1b1b1b;
color:white;
}

.toolbar select{
padding:8px 12px;
border-radius:6px;
border:1px solid #333;
background:#1b1b1b;
color:white;
}

.breadcrumbs{
margin-bottom:15px;
font-size:14px;
color:#ccc;
}

.breadcrumbs span{
cursor:pointer;
color:#4da3ff;
}

.breadcrumbs span:hover{
text-decoration:underline;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
}

.card{
background:#1b1b1b;
border-radius:10px;
padding:10px;
text-align:center;
position:relative;
}

.card.folder{
cursor:pointer;
}

.card input[type="checkbox"]{
position:absolute;
top:8px;
left:8px;
width:18px;
height:18px;
}

.card img{

width:100%;
height:150px;
object-fit:cover;
border-radius:8px;

}

.card p{

font-size:13px;
word-break:break-all;
margin:8px 0 4px;

}

button{

padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;

}

.btn-row{
margin-top:10px;
display:flex;
gap:6px;
justify-content:center;
flex-wrap:wrap;
}

</style>

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="admin-protect.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<div class="header">

<h2>🗂️ File Manager</h2>

<div>

<input
type="file"
id="uploadFile"
style="display:none"
onchange="uploadFile()">

<button
onclick="document.getElementById('uploadFile').click()">

⬆ Upload File

</button>

<button
onclick="createFolder()">

📁 New Folder

</button>

<button
onclick="location.href='website-settings.html'">

⬅ Back

</button>

</div>

</div>

<div class="breadcrumbs" id="breadcrumbs"></div>

<div class="toolbar">

<input type="text" id="searchBox" placeholder="🔍 Search this folder..." oninput="renderFiles()">

<select id="sortBy" onchange="renderFiles()">
<option value="name">Sort: Name</option>
<option value="size">Sort: Size</option>
<option value="date">Sort: Date</option>
</select>

<button id="bulkDeleteBtn" style="background:#e53935;color:white;display:none;" onclick="bulkDelete()">
🗑 Delete Selected
</button>

</div>

<div id="uploadsGrid" class="grid"></div>

<script>

let currentDir = "";
let allFiles = [];

async function loadFiles(){

const res =
await fetch("/api/file-manager/files?dir=" + encodeURIComponent(currentDir));

allFiles = await res.json();

renderBreadcrumbs();
renderFiles();

}

function renderBreadcrumbs(){

const el = document.getElementById("breadcrumbs");

const parts = currentDir ? currentDir.split("/") : [];

let html = `<span onclick="goToFolder('')">🏠 Root</span>`;

let pathSoFar = "";

parts.forEach(part => {

pathSoFar = pathSoFar ? pathSoFar + "/" + part : part;

html += ` / <span onclick="goToFolder('${pathSoFar}')">${part}</span>`;

});

el.innerHTML = html;

}

function goToFolder(dir){

currentDir = dir;

loadFiles();

}

function renderFiles(){

const grid = document.getElementById("uploadsGrid");

const search = document.getElementById("searchBox").value.toLowerCase();
const sortBy = document.getElementById("sortBy").value;

let list = allFiles.filter(f => f.name.toLowerCase().includes(search));

list.sort((a,b) => {

if (a.type !== b.type) return a.type === "folder" ? -1 : 1; // folders first

if (sortBy === "size") return (a.size||0) - (b.size||0);

if (sortBy === "date") return new Date(a.created) - new Date(b.created);

return a.name.localeCompare(b.name);

});

grid.innerHTML = "";

list.forEach(file => {

if (file.type === "folder") {

grid.innerHTML += `

<div class="card folder" onclick="goToFolder('${currentDir ? currentDir + '/' : ''}${file.name}')">

<div style="width:100%;height:150px;display:flex;align-items:center;justify-content:center;font-size:70px;background:#202020;border-radius:8px;">
📁
</div>

<p>${file.name}</p>

<div class="btn-row" onclick="event.stopPropagation()">
<button onclick="renameItem('${file.name}')">✏️ Rename</button>
<button style="background:#e53935;color:white;" onclick="deleteItem('${file.name}')">🗑</button>
</div>

</div>

`;

} else {

grid.innerHTML += `

<div class="card">

<input type="checkbox" class="select-box" data-name="${file.name}" onchange="updateBulkBar()">

${getPreview(file)}

<p>${file.name}</p>

<small>${(file.size/1024).toFixed(1)} KB</small>

<div class="btn-row">

<button onclick="copyLink('${file.url}')">📋 Copy</button>
<button onclick="renameItem('${file.name}')">✏️</button>
<button onclick="moveItem('${file.name}')">➡️ Move</button>
<button style="background:#e53935;color:white;" onclick="deleteItem('${file.name}')">🗑</button>

</div>

</div>

`;

}

});

}

function updateBulkBar(){

const checked = document.querySelectorAll(".select-box:checked");

document.getElementById("bulkDeleteBtn").style.display =
checked.length > 0 ? "inline-block" : "none";

}

async function bulkDelete(){

const checked = [...document.querySelectorAll(".select-box:checked")]
    .map(cb => cb.dataset.name);

if (checked.length === 0) return;

if (!confirm(`Delete ${checked.length} selected item(s)?`)) return;

const res = await fetch("/api/file-manager/delete-bulk", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dir: currentDir, names: checked })
});

const data = await res.json();

if (data.success) {
    toast(`${data.deleted} item(s) deleted`, "success");
} else {
    toast(data.message || "Delete failed", "error");
}

loadFiles();

}

async function createFolder(){

const name = prompt("New folder name:");

if (!name) return;

const res = await fetch("/api/file-manager/folder", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dir: currentDir, name })
});

const data = await res.json();

if (data.success) {
    toast("Folder created", "success");
    loadFiles();
} else {
    toast(data.message || "Could not create folder", "error");
}

}

async function renameItem(oldName){

const newName = prompt("New name:", oldName);

if (!newName || newName === oldName) return;

const res = await fetch("/api/file-manager/rename", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ dir: currentDir, oldName, newName })
});

const data = await res.json();

if (data.success) {
    toast("Renamed", "success");
    loadFiles();
} else {
    toast(data.message || "Rename failed", "error");
}

}

async function moveItem(name){

const targetDir = prompt("Move to folder (leave blank for root, use \"folder/subfolder\" for nested):", "");

if (targetDir === null) return;

const res = await fetch("/api/file-manager/move", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sourceDir: currentDir, name, targetDir })
});

const data = await res.json();

if (data.success) {
    toast("Moved", "success");
    loadFiles();
} else {
    toast(data.message || "Move failed", "error");
}

}

function copyLink(url){

const full =
location.origin + url;

navigator.clipboard.writeText(full);

toast("Copied!", "success");

}

async function deleteItem(name){

if(!confirm("Delete this item?"))
return;

await fetch("/api/file-manager/files/" + encodeURIComponent(name) + "?dir=" + encodeURIComponent(currentDir), {

method:"DELETE"

});

loadFiles();

}

// =====================
// UPLOAD FILE
// =====================

async function uploadFile(){

const input =
document.getElementById("uploadFile");

if(!input.files.length)
return;

const form =
new FormData();

form.append("file",input.files[0]);

const res =
await fetch("/api/file-manager/upload?dir=" + encodeURIComponent(currentDir),{

method:"POST",

body:form

});

const data = await res.json();

input.value="";

// BUG FIX: this used to show "Uploaded Successfully" and refresh
// the file list even when the upload was rejected (e.g. blocked
// file type, size limit) — the error was silently swallowed.
if(!res.ok || !data.success){

toast(data.message || "Upload failed", "error");

return;

}

loadFiles();

toast("Uploaded Successfully", "success");

}

function getPreview(file){

const ext =
file.name.split(".").pop().toLowerCase();

const imageTypes=[
"png",
"jpg",
"jpeg",
"gif",
"webp",
"svg"
];

if(imageTypes.includes(ext)){

return `
<img
loading="lazy"
src="${file.url}"
style="
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
">
`;

}

const icons={

pdf:"📕",

zip:"📦",

rar:"📦",

"7z":"📦",

txt:"📄",

doc:"📄",

docx:"📄",

xls:"📊",

xlsx:"📊",

mp4:"🎬",

mov:"🎬",

avi:"🎬",

mp3:"🎵",

wav:"🎵",

exe:"⚙️"

};

const icon=
icons[ext] || "📁";

return `

<div
style="
width:100%;
height:150px;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
background:#202020;
border-radius:8px;
">

${icon}

</div>

`;

}
loadFiles();

</script>

</body>

</html>
