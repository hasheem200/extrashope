<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Seller Dashboard</title>



<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        injectCustomHtml(s.headHtml, s.footerHtml);

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none';"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
🏪 Dashboard
</div>

<nav>



<button onclick="logout()" class="logout-btn">
🚪 Logout
</button>

</nav>

</header>
<div id="sidebar"></div>
<div class="main-content">
<div class="dashboard-layout">


<!-- MAIN -->

<div class="seller-stats">
<button onclick="viewStore()">
🌍 View Store
</button>


  <h2 id="sellerName">
    Welcome back
  </h2>

 <p id="sellerStatus" style="font-weight:bold;">
🟢 Active Seller
</p>

<p id="sellerBlockReason"
style="color:#ff5252;font-size:14px;">
</p>

<p id="sellerBlockExpire"
style="color:#ff9800;font-size:14px;">
</p>

  <div class="stats-row">

  <div class="stat-card">
    <h2 id="wallet">$0.00</h2>
    <p>Selling Wallet</p>
  </div>

  <div class="stat-card">
    <h2 id="totalWithdraw">
$0.00
</h2>

<p>
Total Withdraw
</p>
  </div>

  <div class="stat-card">
    <h2 id="totalSales">0</h2>
    <p>Total Sales</p>
  </div>

  <div class="stat-card">
    <h2 id="activeProducts">0</h2>
    <p>Active Products</p>
  </div>

</div>




</div>
</div>


<script>
function viewStore(){

const user =
JSON.parse(
localStorage.getItem("user")
);

window.open(
"/store.html?seller=" +
user.nickname,
"_blank"
);

}

/* logout */
function logout(){

localStorage.removeItem("token");

localStorage.removeItem("user");

localStorage.removeItem("loggedIn");

window.location.href="login";

}

async function loadTotalWithdraw(){

    const user =
    JSON.parse(localStorage.getItem("user"));

    const res =
    await fetch("/api/withdraws/" + user.nickname);

    const withdraws =
    await res.json();

    let total = 0;

    withdraws.forEach(w => {

        if(w.status === "Completed ✅"){

            total += Number(w.amount);

        }

    });

    document.getElementById("totalWithdraw").innerText =
        "$" + total.toFixed(2);

}

async function loadSellerDashboard(){

  const user =
  JSON.parse(
    localStorage.getItem("user")
  );

  if(!user) return;

  const usersRes =
  await fetch("/api/users/" + encodeURIComponent(user.nickname));

  const seller =
  usersRes.ok ? await usersRes.json() : null;

  if(!seller) return;

  const status =
document.getElementById("sellerStatus");

const reason =
document.getElementById("sellerBlockReason");

const expire =
document.getElementById("sellerBlockExpire");

if(seller.blocked){

status.innerHTML="🚫 Blocked Seller";
status.style.color="#ff5252";

reason.innerHTML =
seller.blockReason
?
"Reason: "+seller.blockReason
:
"";

if(seller.blockUntil){

const end =
new Date(seller.blockUntil);

const now =
new Date();

const days =
Math.ceil(
(end-now)/(1000*60*60*24)
);

expire.innerHTML=
"Remaining: "+days+" Day(s)";

}else{

expire.innerHTML=
"Permanent Block";

}

}else{

status.innerHTML="🟢 Active Seller";
status.style.color="#00c853";

reason.innerHTML="";
expire.innerHTML="";

}

  document.getElementById(
    "sellerName"
  ).innerText =
  "Welcome back, " +
  seller.nickname + "!";




  document.getElementById(
    "wallet"
  ).innerText =
  "$" +
  Number(
    seller.wallet || 0
  ).toFixed(2);

  document.getElementById(
    "totalSales"
  ).innerText =
  seller.totalSales || 0;

  const productsRes =
  await fetch("/api/products");

  const products =
  await productsRes.json();

  const myProducts =
  products.filter(
    p => p.seller === seller.nickname
  );

 document.getElementById(
  "activeProducts"
).innerText =
myProducts.length;

  const ordersRes =
  await fetch("/api/orders");

  const orders =
  await ordersRes.json();

  const myOrders =
  orders.filter(order =>

    order.products.some(
      p => p.seller === seller.nickname
    )

  );

  const recent =
  myOrders.slice(-5).reverse();

  let html = "";

  recent.forEach(order => {

    html += `
      <div class="admin-product">
        <b>${order.customer}</b>
        <br>
        ${order.status}
        <br>
        $${order.total}
      </div>
    `;

  });

  document.getElementById(
    "recentOrders"
  ).innerHTML =
  html || "No orders found";

}

fetch("seller-sidebar.html")
.then(res => res.text())
.then(data => {
document.getElementById("sidebar").innerHTML = data;
});


loadSellerDashboard();
loadTotalWithdraw();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("seller");
</script>

</body>

</html>
