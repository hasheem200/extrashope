<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
🔐 Login
</div>

<nav>
<a href="/">Home</a>
</nav>

</header>

<div class="auth-container">

<h1>Login / Register</h1>

<input
type="text"
id="username"
placeholder="Nickname">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<select id="role">

<option value="buyer">
🛒 Buyer
</option>

<option value="seller">
🏪 Seller
</option>

</select>

<br><br>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

<p style="margin-top:15px;text-align:center;">

<a href="forgot-password.html">

Forgot Password?

</a>

</p>

</div>

<script>

/* REGISTER */

async function register(){

const username =
document.getElementById("username").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const role =
document.getElementById("role").value;

const res = await fetch(

"/api/users/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

nickname: username,

email,

password,

role

})

}

);

const data =
await res.json();



alert(data.message);

}

/* LOGIN */




async function login(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

const res = await fetch(

"/api/users/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

}

);

const data = await res.json();

console.log(data);

if(!data.token){

alert(data.message);

return;

}

localStorage.setItem(
"token",
data.token
);

localStorage.setItem(
"user",
JSON.stringify(data.user)
);

localStorage.setItem(
"loggedIn",
"true"
);


/* REDIRECT */

if(data.user.role === "seller"){

window.location.href =
"seller-dashboard.html";

}
else if(data.user.role === "admin"){

window.location.href =
"admin.html";

}
else{

window.location.href =
"index.html";

}

}

</script>

</body>

</html>
