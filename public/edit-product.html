<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Edit Product</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet"
href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
✏ Edit Product
</div>

<nav>

<a href="seller-products">
⬅ Back
</a>

</nav>

</header>

<div class="auth-container">

<h1>
Edit Product
</h1>

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="number"
id="productPrice"
placeholder="Price">

<input
type="text"
id="productCategory"
placeholder="Category">

<input
type="text"
id="productPlatform"
placeholder="Platform">

<input
type="text"
id="productLogin"
placeholder="Login">

<input
type="text"
id="productPassword"
placeholder="Password">

<input
type="text"
id="productDownload"
placeholder="Download Link">

<textarea
id="productStockData"
placeholder="Stock Data (one account per line)"
rows="10">
</textarea>

<button onclick="updateProduct()">
Update Product
</button>

</div>

<script>



const params =
new URLSearchParams(
window.location.search
);

const productId =
params.get("id");

async function loadProduct(){

const res =
await fetch("/api/products");

const products =
await res.json();

const product =
products.find(p =>

p._id === productId



);

if(!product){

toast("Product Not Found");

return;

}

document.getElementById(
"productName"
).value = product.name;

document.getElementById(
"productPrice"
).value = product.price;

document.getElementById(
"productCategory"
).value = product.category;

document.getElementById(
"productPlatform"
).value = product.platform;

document.getElementById(
"productLogin"
).value = product.login;

document.getElementById(
"productPassword"
).value = product.password;

document.getElementById(
"productDownload"
).value = product.download;

document.getElementById(
"productStockData"
).value = product.stockData || "";

}

async function updateProduct(){

const updatedProduct = {

name:
document.getElementById("productName").value,

price:
document.getElementById("productPrice").value,

category:
document.getElementById("productCategory").value,

platform:
document.getElementById("productPlatform").value,

login:
document.getElementById("productLogin").value,

password:
document.getElementById("productPassword").value,

download:
document.getElementById("productDownload").value,

stockData:
document.getElementById("productStockData").value

};

const res = await fetch(

"/api/products/" + productId,

{

method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(updatedProduct)

}

);

const data = await res.json();

alert(data.message || "Product Updated ✅");

window.location.href =
"seller-products.html";

}



loadProduct();

</script>

</body>

</html>
