<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seller Store</title>

<script>
// ============================================
// 1️⃣ تحديث عنوان الصفحة: اسم المتجر - اسم الموقع
// 2️⃣ تحديث الـ Favicon من الإعدادات
// 3️⃣ تحديث اسم الموقع في الهيدر
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🏪";
        const favicon = s.favicon || "";

        injectCustomHtml(s.headHtml, s.footerHtml);

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث اسم الموقع في الهيدر
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none';"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        // 4. جلب اسم المتجر من الـ URL
        const params = new URLSearchParams(window.location.search);
        const sellerNickname = params.get("seller");

        if (!sellerNickname) {
            document.title = `Store - ${siteName}`;
            return;
        }

        // 5. جلب بيانات البائع
        const usersRes = await fetch("/api/users/" + encodeURIComponent(sellerNickname));
        const seller = usersRes.ok ? await usersRes.json() : null;

        // 6. تحديث عنوان الصفحة
        if (seller) {
            const storeName = seller.storeName || seller.nickname || "Store";
            document.title = `${storeName} - ${siteName}`;

            setSeoTags({
                title: document.title,
                description: seller.storeDescription || `${storeName}'s shop on ${siteName}`,
                image: seller.storeLogo || seller.storeBanner || "",
                siteName: siteName,
                type: "website"
            });

        } else {
            document.title = `Store - ${siteName}`;
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        document.title = "Store - My Site";
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>


<link rel="stylesheet" href="style.css">


<style>
.store-banner{
height:220px;
background:#f08c00;
border-radius:15px 15px 0 0;
}

.store-card{
background:white;
border-radius:15px;
overflow:hidden;
margin:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.store-info{
display:flex;
align-items:center;
gap:20px;
padding:20px;
}

.store-avatar img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

.store-avatar{
width:90px;
height:90px;
border-radius:50%;
background:#f08c00;
color:white;
font-size:40px;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
}

.store-products{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:20px;
padding:20px;
}
</style>

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
🏪 Seller Store
</div>

<nav>
<a href="/">Home</a>
<a href="profile">Profile</a>
</nav>

</header>

<div class="store-card">

<div id="storeBanner" class="store-banner"></div>

<div class="store-info">

<div id="storeAvatar" class="store-avatar">
T
</div>

<div>

<h2 id="storeName">
Store
</h2>

<p id="storeDescription">
Store Description
</p>

<p id="storeFollowers">
0 Followers
</p>

</div>

</div>

</div>

<div class="container">

<h2>Products</h2>

<div
class="store-products"
id="storeProducts">
</div>

</div>

<script>

const params =
new URLSearchParams(
window.location.search
);

const sellerNickname =
params.get("seller");

async function loadSeller(){

const res =
await fetch("/api/users/" + encodeURIComponent(sellerNickname));

const seller =
res.ok ? await res.json() : null;

if(!seller) return;

document.getElementById(
"storeName"
).innerText =
seller.storeName ||
seller.nickname;

document.getElementById(
"storeDescription"
).innerText =
seller.storeDescription || "";

if(seller.storeLogo){

document.getElementById(
"storeAvatar"
).innerHTML =

`<img loading="lazy" src="${seller.storeLogo}">`;

}else{

document.getElementById(
"storeAvatar"
).innerText =

seller.nickname
.charAt(0)
.toUpperCase();

}

if(seller.storeBanner){

document.getElementById(
"storeBanner"
).style.backgroundImage =

`url(${seller.storeBanner})`;

document.getElementById(
"storeBanner"
).style.backgroundSize =
"cover";

document.getElementById(
"storeBanner"
).style.backgroundPosition =
"center";

}

if(seller.storeLogo){

document.getElementById(
"storeAvatar"
).innerHTML =

`<img loading="lazy" src="${seller.storeLogo}"
style="
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
">`;

}

if(seller.storeBanner){

document.getElementById(
"storeBanner"
).style.backgroundImage =

`url(${seller.storeBanner})`;

}

}

async function loadProducts(){

const res =
await fetch("/api/products");

const products =
await res.json();

const sellerProducts =
products.filter(
p => p.seller === sellerNickname
);

const container =
document.getElementById(
"storeProducts"
);

container.innerHTML = "";

sellerProducts.forEach(product=>{

container.innerHTML += `

<div class="card">

<img
src="${product.image}"
width="100%">

<h3>
${product.name}
</h3>

<p>
💲 ${product.price}
</p>

<a href="product?id=${product.id}">
<button>
View Product
</button>
</a>

</div>

`;

});

}

loadSeller();
loadProducts();

</script>

</body>

</html>
