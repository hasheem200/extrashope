<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Forgot Password</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        injectCustomHtml(s.headHtml, s.footerHtml);

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;" onerror="this.style.display='none';"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.box{

width:400px;

max-width:95%;

margin:80px auto;

background:white;

padding:25px;

border-radius:10px;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

input{

width:100%;

padding:12px;

margin:15px 0;

border:1px solid #ddd;

border-radius:6px;

}

button{

width:100%;

padding:12px;

background:#00c853;

color:white;

border:none;

border-radius:6px;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#00b248;

}

#msg{

margin-top:15px;

text-align:center;

font-weight:bold;

}

</style>

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<!-- STEP 1: enter email -->
<div id="step1">

<p>Enter your email address. We'll send you a 6-digit code.</p>

<input
type="email"
id="email"
placeholder="Email">

<button onclick="sendReset()" id="sendBtn">

Send Code

</button>

</div>

<!-- STEP 2: enter code + new password (hidden until code is sent) -->
<div id="step2" style="display:none;">

<p>Enter the 6-digit code sent to your email, and your new password.</p>

<input
type="text"
id="code"
maxlength="6"
placeholder="6-digit code"
style="text-align:center;letter-spacing:6px;font-size:20px;">

<input
type="password"
id="newPassword"
placeholder="New Password">

<button onclick="submitReset()">

Update Password

</button>

<p style="text-align:center;margin-top:10px;">

<a href="#" onclick="resendCode();return false;">Resend code</a>

</p>

</div>

<p id="msg"></p>

<p style="text-align:center;margin-top:20px;">

<a href="login">

⬅ Back to Login

</a>

</p>

</div>

<script>

let savedEmail = "";

async function sendReset(){

const email =
document.getElementById("email").value;

if(!email){
document.getElementById("msg").innerText = "Please enter your email";
return;
}

const btn = document.getElementById("sendBtn");
btn.disabled = true;
btn.innerText = "Sending...";

try{

const res =
await fetch("/api/password/forgot",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email

})

});

const data =
await res.json();

document.getElementById("msg").innerText =
data.message;

if(res.ok){

savedEmail = email;

document.getElementById("step1").style.display = "none";
document.getElementById("step2").style.display = "block";

}

}catch(err){

document.getElementById("msg").innerText =
"Network error, please try again.";

}finally{

btn.disabled = false;
btn.innerText = "Send Code";

}

}

function resendCode(){

document.getElementById("step2").style.display = "none";
document.getElementById("step1").style.display = "block";
document.getElementById("msg").innerText = "";

}

async function submitReset(){

const code =
document.getElementById("code").value.trim();

const password =
document.getElementById("newPassword").value;

if(!code || !password){
document.getElementById("msg").innerText = "Enter the code and a new password";
return;
}

const res =
await fetch("/api/password/reset",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:savedEmail,
code,
password

})

});

const data =
await res.json();

document.getElementById("msg").innerText =
data.message;

if(data.message === "Password updated successfully"){

setTimeout(()=>{

window.location.href = "login";

},1500);

}

}

</script>

</body>

</html>
