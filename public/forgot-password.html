<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Forgot Password</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.box{

width:400px;

max-width:95%;

margin:80px auto;

background:white;

padding:25px;

border-radius:10px;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

input{

width:100%;

padding:12px;

margin:15px 0;

border:1px solid #ddd;

border-radius:6px;

}

button{

width:100%;

padding:12px;

background:#00c853;

color:white;

border:none;

border-radius:6px;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#00b248;

}

#msg{

margin-top:15px;

text-align:center;

font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h2>Forgot Password</h2>

<p>

Enter your email address.

We'll send you a password reset link.

</p>

<input
type="email"
id="email"
placeholder="Email">

<button onclick="sendReset()">

Send Reset Link

</button>

<p id="msg"></p>

<p style="text-align:center;margin-top:20px;">

<a href="login.html">

⬅ Back to Login

</a>

</p>

</div>

<script>

async function sendReset(){

const email =
document.getElementById("email").value;

const res =
await fetch("/api/password/forgot",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email

})

});

const data =
await res.json();

document.getElementById("msg").innerText =
data.message;

}

</script>

</body>

</html>
