<script>

async function approve(id){

    await fetch("/api/ads/"+id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            status:"Approved"

        })

    });

    await fetch("/api/settings/addAdsRevenue",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            adId:id

        })

    });

    loadAds();

}

async function addProduct(){

/* IMAGE */

const file =
document.getElementById("imageFile").files[0];

if(!file){

alert("Select Image First");

return;

}

const formData =
new FormData();

formData.append("image", file);

const uploadRes =
await fetch("/api/upload",{

method:"POST",

body:formData

});

const uploadData =
await uploadRes.json();

const image =
uploadData.image;

/* PRODUCT */

const product = {

id:
"PROD-" + Math.floor(
100000 + Math.random() * 900000
),

name:
document.getElementById("productName").value,

price:
document.getElementById("productPrice").value,

image,

type:
document.getElementById("productType").value,

category:
document.getElementById("productCategory").value,

platform:
document.getElementById("productPlatform").value,

login:
document.getElementById("productLogin").value,

password:
document.getElementById("productPassword").value,

download:
document.getElementById("productDownload").value,

seller:"Admin"

};

/* SAVE */

const res = await fetch(

"/api/products",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(product)

}

);

const data =
await res.json();

alert(

data.message +

"\n\nProduct ID: " +

product.id

);

window.location.href = "/";

}

</script>
