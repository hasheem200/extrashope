<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<title>Support Center</title>

<link rel="stylesheet" href="style.css">

<style>

body{
background:#f5f5f5;
font-family:Arial;
margin:0;
}

.support-layout{
display:flex;
height:100vh;
}

.chat-list{
width:300px;
background:white;
border-right:1px solid #ddd;
overflow:auto;
}

.chat-item{
padding:15px;
border-bottom:1px solid #eee;
cursor:pointer;
}

.chat-item:hover{
background:#f3f3f3;
}

.chat-box{
flex:1;
display:flex;
flex-direction:column;
}

.messages{
flex:1;
padding:20px;
overflow:auto;
background:#fafafa;
}

.msg{
padding:10px;
margin-bottom:10px;
border-radius:10px;
max-width:70%;
}

.user{
background:#dbeafe;
margin-right:auto;
}

.admin{
background:#dcfce7;
margin-left:auto;
}

.send{
display:flex;
padding:15px;
background:white;
border-top:1px solid #ddd;
}

.send input{
flex:1;
padding:12px;
}

.send button{
padding:12px 25px;
background:orange;
border:none;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

  
<header>
    <div class="logo">
💬 Support
</div>
  <nav>
<a href="/">Home</a>
<a href="admin-support.html">💬 Support Center</a>
<a href="admin-Products-Manager.html">Products Manager</a>
<a href="add-product.html">Add Product</a>
<a href="admin-orders.html">Pending Orders</a>
<a href="admin-payment.html">payment</a>
<a href="admin.html">Admin Panel</a>
<a href="admin-manage-users.html">👥 Manage Users</a>
<a href="admin-withdraws.html">💸 Withdraw</a>
<button onclick="logout()" class="logout-btn">
🚪 Logout
</button>
</nav>

</header>



<div class="support-layout">

<div class="chat-list" id="chatList">

</div>

<div class="chat-box">

<div id="supportContainer" class="messages"></div>

</div>

</div>
<script>

let currentId = null;

async function loadChats(){

    const res = await fetch("/api/support");
    const chats = (await res.json())
.filter(c => c.status !== "Closed");

    const list = document.getElementById("chatList");
    list.innerHTML = "";

    chats.forEach(chat=>{

       list.innerHTML += `
<div class="chat-item" onclick="openChat('${chat._id}')">
    <b>${chat.seller}</b>
    <small style="color:#888;">(${chat.role})</small><br>
    ${chat.subject}
</div>
`;

    });

}

async function openChat(id){

    currentId = id;

    const res = await fetch("/api/support");
    const chats = await res.json();

    const chat = chats.find(c => c._id === id);

    const box = document.getElementById("supportContainer");

    box.innerHTML = `
        <div class="msg user">
    <b>${chat.seller}</b>
    <small style="color:#888;">(${chat.role})</small><br>

    <b>Subject:</b> ${chat.subject}<br><br>

    ${chat.message}
</div>

        <div class="msg admin">
            ${chat.reply || ""}
        </div>

        <br>

        <textarea
            id="reply-${chat._id}"
            style="width:100%;height:120px"
            placeholder="Write reply..."
        >${chat.reply || ""}</textarea>

        <br><br>

        <button onclick="sendReply('${chat._id}')">
            Send Reply
        </button>
    `;
}

async function sendReply(id){

    const reply =
    document.getElementById("reply-"+id).value;

    if(reply.trim()==""){
        alert("Write reply first");
        return;
    }

    await fetch("/api/support/"+id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            reply:reply,

            status:"Closed"

        })

    });

    reply.value = "";

currentId = null;

loadChats();

document.getElementById("supportContainer").innerHTML =
"<h2 style='padding:40px;color:#888'>Select Chat</h2>";

    alert("Reply Sent ✅");

    loadChats();
openChat(currentId);

}

loadChats();

</script>


</body>
</html>
