<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
🧾 Checkout
</div>

<nav>
<a href="/">Home</a>
<a href="cart.html">Cart</a>
</nav>

</header>

<div class="auth-container">

<h1>Payment Details</h1>

<h3>Total Amount:</h3>

<p id="totalPrice"></p>

<hr>
<!-- CRYPTO PAYMENT -->

<div class="crypto-box">

<h2 id="paymentTitle"></h2>

<p id="paymentDescription"></p>

<input
id="walletAddress"
readonly>

<p id="paymentNetwork"></p>


<button onclick="copyWallet()">
Copy
</button>

</div>

<!-- END CRYPTO PAYMENT -->

<hr>

<p>
After payment upload proof screenshot.
</p>

<input
type="file"
id="paymentProof">

<br><br>

<button onclick="submitOrder()">
Submit Payment
</button>

</div>

<script>

async function loadPaymentSettings(){

    const res =
    await fetch("/api/payment-settings");

    const data =
    await res.json();

    document.getElementById("paymentTitle").innerHTML =
        "💳 " + data.name;

    document.getElementById("paymentDescription").innerText =
        data.description;

    document.getElementById("walletAddress").value =
        data.account;

    document.getElementById("paymentNetwork").innerText =
        data.network;

    document.getElementById("copyBtn").innerText =
        data.buttonText;

}

loadPaymentSettings();

/* COPY WALLET */

function copyWallet(){

const wallet =
document.getElementById("walletAddress").value;

navigator.clipboard.writeText(wallet);

alert("Wallet copied ✔");

}

/* GET CART */

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const total =
cart.reduce(
(sum,item)=>
sum + Number(item.price),
0
);

document.getElementById(
"totalPrice"
).innerText =
"$" + total;

async function submitOrder(){

const proofFile =
document.getElementById(
"paymentProof"
).files[0];

if(!proofFile){

alert(
"Upload Payment Proof First"
);

return;

}

/* UPLOAD IMAGE */

const formData =
new FormData();

formData.append(
"image",
proofFile
);

const uploadRes =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadRes.json();

/* CART */

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

/* USER */

const user =
JSON.parse(
localStorage.getItem("user")
) || {};

/* TOTAL */

const total =
cart.reduce(
(sum,item)=>
sum + Number(item.price),
0
);

/* ORDER */

const order = {

customer:
user.nickname || "Guest",

products:cart,

total,

paymentProof:
uploadData.image,

status:"Pending"

};

/* SAVE ORDER */

const res =
await fetch(
"/api/orders",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify(order)
}
);

const data =
await res.json();

alert(
"Order Submitted ✅"
);

localStorage.removeItem(
"cart"
);

window.location.href =
"/";

}

</script>
<script src="js/auth.js"></script>


</body>
</html>
