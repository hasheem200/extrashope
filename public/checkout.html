<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
🧾 Checkout
</div>

<nav>
<a href="/">Home</a>
<a href="cart">Cart</a>
</nav>

</header>

<div class="auth-container">

<h1>Payment Details</h1>

<h3>Total Amount:</h3>

<p id="totalPrice"></p>

<hr>
<!-- CRYPTO PAYMENT -->

<div class="crypto-box">

<h2 id="paymentTitle"></h2>

<p id="paymentDescription"></p>

<input
id="walletAddress"
readonly>

<p id="paymentNetwork"></p>


<button onclick="copyWallet()">
Copy
</button>

</div>

<!-- END CRYPTO PAYMENT -->

<hr>

<p>
After payment upload proof screenshot.
</p>

<input
type="file"
id="paymentProof">

<br><br>

<button onclick="submitOrder()">
Submit Payment
</button>

</div>

<script>

async function loadPaymentSettings(){

    const res =
    await fetch("/api/payment-settings");

    const data =
    await res.json();

    document.getElementById("paymentTitle").innerHTML =
        "💳 " + data.name;

    document.getElementById("paymentDescription").innerText =
        data.description;

    document.getElementById("walletAddress").value =
        data.account;

    document.getElementById("paymentNetwork").innerText =
        data.network;

    document.getElementById("copyBtn").innerText =
        data.buttonText;

}

loadPaymentSettings();

/* COPY WALLET */

function copyWallet(){

const wallet =
document.getElementById("walletAddress").value;

navigator.clipboard.writeText(wallet);

toast("Wallet copied ✔");

}

/* GET CART */

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

const total =
cart.reduce(
(sum,item)=>
sum + Number(item.price),
0
);

document.getElementById(
"totalPrice"
).innerText =
"$" + total;

async function submitOrder(){

const proofFile =
document.getElementById(
"paymentProof"
).files[0];

if(!proofFile){

toast(
"Upload Payment Proof First"
);

return;

}

/* UPLOAD IMAGE */

const formData =
new FormData();

formData.append(
"image",
proofFile
);

const uploadRes =
await fetch(
"/api/upload",
{
method:"POST",
body:formData
}
);

const uploadData =
await uploadRes.json();

/* CART */

const cart =
JSON.parse(
localStorage.getItem("cart")
) || [];

/* USER */

const user =
JSON.parse(
localStorage.getItem("user")
) || {};

/* TOTAL */

const total =
cart.reduce(
(sum,item)=>
sum + Number(item.price),
0
);

/* ORDER */

const order = {

customer:
user.nickname || "Guest",

products:cart,

total,

paymentProof:
uploadData.image,

status:"Pending"

};

/* SAVE ORDER */

const res =
await fetch(
"/api/orders",
{
method:"POST",
headers:{
"Content-Type":
"application/json"
},
body:JSON.stringify(order)
}
);

const data =
await res.json();

alert(
"Order Submitted ✅"
);

localStorage.removeItem(
"cart"
);

window.location.href =
"/";

}

</script>
<script src="js/auth.js"></script>


</body>
</html>
