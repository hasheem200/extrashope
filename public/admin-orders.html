<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Orders</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

    

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet"
href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
📦 Admin Orders
</div>

<nav>
<a href="admin" class="back">
⬅ Back To Admin
</a>
</nav>

</header>

<div class="container">

<h1>
Pending Orders
</h1>

<div id="orders"></div>

</div>

<script>

async function loadOrders(){

const res =
await fetch("/api/orders");

const orders =
await res.json();

const ordersDiv =
document.getElementById(
"orders"
);

ordersDiv.innerHTML = "";

orders
.filter(order => order.status === "Pending")
.forEach(order=>{

ordersDiv.innerHTML += `

<div class="cart-card">

<h3>
Customer:
${order.customer || order.userName}
</h3>

<p>
Total:
$${order.total}
</p>

<p>
Status:
${order.status}
</p>

${
order.paymentProof ?

`<a
href="${order.paymentProof}"
target="_blank"
>

<a
href="${order.paymentProof}"
target="_blank"
>

<img
src="${order.paymentProof}"
width="200"
style="
cursor:pointer;
border-radius:10px;
">

</a>`

: ""

}

<a
href="${order.paymentProof}"
target="_blank"
>

<button>
View Full Proof
</button>

</a>

<br><br>

<button
onclick="approveOrder(
'${order._id}'
)">
Approve
</button>

<button
onclick="rejectOrder(
'${order._id}'
)">
Reject
</button>

</div>

<br>

`;

});

}

/* APPROVE */

async function approveOrder(id){

await fetch(

"/api/orders/" + id,

{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

status:"Approved"

})

}

);

toast(
"Order Approved ✅"
);

loadOrders();

}

/* REJECT */

async function rejectOrder(id){

await fetch(

"/api/orders/" + id,

{

method:"PUT",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

status:"Rejected"

})

}

);

toast(
"Order Rejected ❌"
);

loadOrders();

}

loadOrders();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("admin");
</script>

</body>

</html>
