<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Reset Password</title>

<link rel="stylesheet" href="style.css">

<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.box{

width:400px;

max-width:95%;

margin:80px auto;

background:white;

padding:25px;

border-radius:10px;

box-shadow:0 0 15px rgba(0,0,0,.1);

}

input{

width:100%;

padding:12px;

margin:15px 0;

border:1px solid #ddd;

border-radius:6px;

}

button{

width:100%;

padding:12px;

background:#00c853;

color:white;

border:none;

border-radius:6px;

cursor:pointer;

font-size:16px;

}

button:hover{

background:#00b248;

}

#msg{

margin-top:15px;

text-align:center;

font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h2>Reset Password</h2>

<input
type="password"
id="password"
placeholder="New Password">

<button onclick="resetPassword()">

Update Password

</button>

<p id="msg"></p>

</div>

<script>

const token =
new URLSearchParams(
window.location.search
).get("token");

async function resetPassword(){

const password =
document.getElementById("password").value;

const res =
await fetch("/api/password/reset",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

token,

password

})

});

const data =
await res.json();

document.getElementById("msg").innerText =
data.message;

if(data.message === "Password updated successfully"){

setTimeout(()=>{

window.location.href="login.html";

},2000);

}

}

</script>

</body>

</html>
