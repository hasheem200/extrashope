<script>

const accountCategories = [

"Google",
"YouTube",
"Facebook ",
"Reddit",
"Instagram",
"Twitter",
"TikTok",
"TikTok Ads",
"Other Emails",
"Github",
"Discord",
"Snapchat",
"ID APPLE",
"Linkedin",
"Spotify",
"Tripadvisor",
"Trustpilot",
"Medium",
"Pinterest",
"AI",
"Other Social Networks",
"Web 2.0",
"Multimedia Editors",
"Amazon",
"Key Windows/Microsoft",
"Accounts Game"

];

document
.getElementById("productCategory")
.addEventListener("change",()=>{

const category =
document.getElementById("productCategory").value;

if(accountCategories.includes(category)){

document.getElementById(
"stockBox"
).style.display = "block";

}else{

document.getElementById(
"stockBox"
).style.display = "none";

}

}); 

async function addProduct(){



/* IMAGE */

const file =
document.getElementById("imageFile").files[0];

const formData =
new FormData();

formData.append("image", file);

const uploadRes =
await fetch("/api/upload",{

method:"POST",

body:formData

});

const uploadData =
await uploadRes.json();

const image =
uploadData.image;

/* PRODUCT */

const product = {

id:
"PROD-" + Math.floor(
100000 + Math.random() * 900000
),

name:
document.getElementById("productName").value,

price:
document.getElementById("productPrice").value,

image,

type:
document.getElementById("productType").value,

category:
document.getElementById("productCategory").value,

platform:
document.getElementById("productPlatform").value,

login:
document.getElementById("productLogin").value,

password:
document.getElementById("productPassword").value,

download:
document.getElementById("productDownload").value,

seller:
JSON.parse(
localStorage.getItem("user")
).nickname,

stockData:
document.getElementById("stockData")
? document.getElementById("stockData").value
: ""

};

/* SAVE */

const res = await fetch(

"/api/products",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(product)

}

);

const data =
await res.json();

alert(

data.message +

"\n\nProduct ID: " +

product.id

);

window.location.href = "/";

}

</script>
