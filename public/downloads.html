<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Downloads</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<header>

<div class="logo">
💾 My Downloads
</div>

<nav>

<a href="/">
Home
</a>

<a href="orders.html">
Orders
</a>

</nav>

</header>

<div class="container">

<h1>
Purchased Products
</h1>

<div id="downloadsContainer"></div>

</div>

<script>

async function loadDownloads(){

const user =
JSON.parse(localStorage.getItem("user"));

if(!user){

window.location.href =
"login.html";

return;

}

/* GET ORDERS */

const ordersRes =
await fetch("/api/orders");

const orders =
await ordersRes.json();

const myOrders =
orders.filter(order =>

(
order.userId == user.id ||

order.customer == user.nickname
)

&&

order.status === "Approved"

);
 
const container =
document.getElementById(
"downloadsContainer"
);

container.innerHTML = "";

/* PRODUCTS */

myOrders.forEach(order=>{

order.products.forEach(product=>{

if(product.type === "Digital"){


console.log("ORDER =", order);
console.log("PRODUCT =", product);

container.innerHTML += `

<div class="admin-product">

<img src="${product.image}">

<div>

<h2>
${product.name}
</h2>

<p>
${product.platform || ""}
</p>

<p>
Login:${order.deliveredLogin || product.login || ""}
</p>

<p>
Password:${order.deliveredPassword || product.password || ""}
</p>

<a href="${product.download}"target="_blank">

<button> Download </button>

</a>


</div>

`;


}

});

});

}

loadDownloads();

</script>
<script src="js/auth.js"></script>


</body>

</html>
