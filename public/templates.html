<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
async function applySiteSettings() {
    try {
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) faviconLink.href = favicon;
        }

        document.title = `Templates - ${siteName}`;

    } catch (error) {
        console.error('Failed to apply settings:', error);
        document.title = "Templates";
    }
}
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<style>

.templates-wrap{
max-width:1000px;
margin:30px auto;
padding:0 20px;
}

.templates-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:20px;
margin-top:20px;
}

.template-card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.08);
cursor:pointer;
transition:transform .15s;
}

.template-card:hover{
transform:translateY(-4px);
}

.template-card img{
width:100%;
height:170px;
object-fit:cover;
display:block;
}

.template-card .info{
padding:14px;
}

.template-card h3{
margin:0 0 6px;
font-size:16px;
}

.template-card .price{
color:#00c853;
font-weight:bold;
font-size:15px;
}

.empty-state{
text-align:center;
padding:60px 20px;
color:#888;
}

</style>

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">🧩 Templates</div>

<nav>

<a href="/">Home</a>
<a href="cart">Cart</a>

</nav>

</header>

<div class="templates-wrap">

<h1>🧩 Templates</h1>

<p style="color:#666;">
Full source-code platform templates — ready to install and launch.
</p>

<div id="templatesGrid" class="templates-grid"></div>

</div>

<script>

async function loadTemplates(){

if(typeof showLoading === "function") showLoading();

try{

const res = await fetch("/api/products");

const products = await res.json();

const templates = products.filter(p => p.category === "Template");

const grid = document.getElementById("templatesGrid");

if(templates.length === 0){

grid.innerHTML = `
    <div class="empty-state" style="grid-column:1/-1;">
        No templates available right now. Check back soon.
    </div>
`;

return;

}

grid.innerHTML = templates.map(t => `

<div class="template-card" onclick="window.location.href='template-details?id=${t.id}'">

<img loading="lazy" src="${t.image}" onerror="this.src='/images/no-image.png';">

<div class="info">
<h3>${t.name}</h3>
<div class="price">$${Number(t.price || 0).toFixed(2)}</div>
</div>

</div>

`).join("");

}catch(err){

console.log(err);

if(typeof toast === "function"){
    toast("Couldn't load templates. Please try again.", "error");
}

}finally{

if(typeof hideLoading === "function") hideLoading();

}

}

loadTemplates();

</script>

</body>
</html>
