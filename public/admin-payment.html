<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Commission</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
👑 Admin Commission
</div>

<nav>

<a href="/">Home</a>

</nav>

</header>

<div class="admin-payment-page">

<h1>Pay 1$ Commission</h1>

<div class="crypto-box">

<h2>🟡 Binance Admin Wallet</h2>

<p>
Send 1$ USDT (BEP20)
</p>

<div class="wallet">

<input
type="text"
id="adminWallet"
value="0xADMIN123456789BINANCE"
readonly>

<button onclick="copyAdminWallet()">
Copy
</button>

</div>

</div>

<h2>Upload Payment Proof</h2>

<input
type="file"
id="adminProof">

<button onclick="sendToAdmin()">

Send To Admin

</button>

<div id="adminResult"></div>

</div>

<script>

/* COPY */

function copyAdminWallet(){

const wallet =
document.getElementById("adminWallet");

wallet.select();

document.execCommand("copy");

toast("Admin wallet copied ✔");

}

/* SEND */

function sendToAdmin(){

const file =
document.getElementById("adminProof").files[0];

if(!file){

toast("Choose screenshot");

return;

}

const reader = new FileReader();

reader.onload = function(e){

const adminProof = {

image: e.target.result,

status: "Pending Admin Approval",

date: new Date().toLocaleString()

};

localStorage.setItem(
"adminProof",
JSON.stringify(adminProof)
);

showAdminApproval();

};

reader.readAsDataURL(file);

}

/* SHOW */

function showAdminApproval(){

const proof =
JSON.parse(localStorage.getItem("adminProof"));

const result =
document.getElementById("adminResult");

if(proof){

result.innerHTML = `

<div class="proof-card">

<img loading="lazy" src="${proof.image}">

<h3>${proof.status}</h3>

<p>${proof.date}</p>

<button onclick="approveAdmin()">

Approve & Deliver Product

</button>

</div>

`;

}

}

/* APPROVE */

function approveAdmin(){

localStorage.setItem(
"productDelivered",
"true"
);

alert("Product delivered to buyer 🎉");

window.location.href =
"orders.html";

}

/* AUTO LOAD */

showAdminApproval();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("admin");
</script>

</body>

</html>
