<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Payment Settings</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<style>

.container{
width:700px;
max-width:95%;
margin:40px auto;
background:#fff;
padding:30px;
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

input{
width:100%;
padding:15px;
margin-bottom:20px;
}

button{
width:100%;
padding:15px;
background:#ff9800;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:18px;
}

</style>

<script src="js/auth-fetch.js"></script>
<script src="js/page-access.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="admin-protect.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
💳 Payment Settings
</div>

<nav>
<a href="admin">← Back</a>
</nav>

</header>

<div class="container">

<h2>Payment Method</h2>

<input id="name" placeholder="Payment Name">

<input id="description" placeholder="Description">

<input id="account" placeholder="Wallet / Account">

<input id="network" placeholder="Network">

<input id="buttonText" placeholder="Button Text">

<label style="display:block;margin-bottom:8px;color:#555;font-size:14px;">
Payment Method Logo (shown to buyers at checkout)
</label>

<img id="logoPreview" style="max-height:50px;display:none;margin-bottom:10px;">

<input type="file" id="logoFile" accept="image/*" style="margin-bottom:20px;">

<label style="display:block;margin-bottom:8px;color:#555;font-size:14px;">
Payment QR Code (buyers can scan this to pay instead of copying the address)
</label>

<img id="qrPreview" style="max-width:150px;display:none;margin-bottom:10px;">

<input type="file" id="qrFile" accept="image/*" style="margin-bottom:20px;">

<hr style="margin:25px 0;border:none;border-top:1px solid #eee;">

<label style="display:block;margin-bottom:8px;color:#555;font-size:14px;">
Notification Email (receives a copy of every platform notification — withdraw requests, orders, support tickets, etc.)
</label>

<input id="notificationEmail" placeholder="you@example.com">

<button onclick="save()">
Save Settings
</button>

</div>

<script>

let currentLogo = "";
let currentQr = "";

async function load(){

    const res =
    await fetch("/api/payment-settings/full");

    const data =
    await res.json();

    document.getElementById("name").value =
    data.name || "";

    document.getElementById("description").value =
    data.description || "";

    document.getElementById("account").value =
    data.account || "";

    document.getElementById("network").value =
    data.network || "";

    document.getElementById("buttonText").value =
    data.buttonText || "";

    document.getElementById("notificationEmail").value =
    data.notificationEmail || "";

    currentLogo = data.logo || "";
    currentQr = data.qr || "";

    if(currentLogo){
        const preview = document.getElementById("logoPreview");
        preview.src = currentLogo;
        preview.style.display = "inline-block";
    }

    if(currentQr){
        const preview = document.getElementById("qrPreview");
        preview.src = currentQr;
        preview.style.display = "inline-block";
    }

}

async function uploadIfSelected(inputId){

    const file = document.getElementById(inputId).files[0];

    if(!file) return null;

    const form = new FormData();
    form.append("image", file);

    const res = await fetch("/api/upload", {
        method:"POST",
        body:form
    });

    const data = await res.json();

    if(!res.ok || !data.image){
        toast(data.message || `Upload of ${inputId} failed — keeping the previous file.`, "error");
        return null;
    }

    return data.image;

}

async function save(){

    // Upload any newly-selected logo/QR first. If nothing was
    // selected (or the upload failed), fall back to whatever was
    // already saved — editing other fields never wipes these out.
    const newLogo = await uploadIfSelected("logoFile");
    const newQr = await uploadIfSelected("qrFile");

    const logo = newLogo || currentLogo;
    const qr = newQr || currentQr;

    const res = await fetch("/api/payment-settings",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({

            name:document.getElementById("name").value,

            description:document.getElementById("description").value,

            account:document.getElementById("account").value,

            network:document.getElementById("network").value,

            buttonText:document.getElementById("buttonText").value,

            notificationEmail:document.getElementById("notificationEmail").value,

            logo,

            qr

        })

    });

    if(res.ok){
        currentLogo = logo;
        currentQr = qr;
    }

    toast("Saved Successfully ✅");

}

load();

</script>

</body>
</html>
