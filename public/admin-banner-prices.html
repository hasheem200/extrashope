<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banner Prices</title>

<link rel="stylesheet" href="style.css">

<style>

.container{

width:700px;

max-width:95%;

margin:40px auto;

background:white;

padding:30px;

border-radius:12px;

box-shadow:0 5px 15px rgba(0,0,0,.1);

}

h1{

text-align:center;

margin-bottom:30px;

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

padding:15px;

border-bottom:1px solid #eee;

}

.row input{

width:120px;

padding:10px;

font-size:18px;

text-align:center;

}

button{

width:100%;

padding:15px;

background:#ff9800;

border:none;

border-radius:8px;

color:white;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<header>

<div class="logo">

🏷 Banner Prices

</div>

<nav>

<a href="admin.html">

⬅ Back

</a>

</nav>

</header>

<div class="container">

<h1>Advertisement Prices</h1>

<div class="row">

<span>🏆 Top Leaderboard</span>

<input type="number" id="topPrice">

</div>

<div class="row">

<span>📏 long</span>

<input type="number" id="longPrice">

</div>

<div class="row">

<span>🟨 Large Banner</span>

<input type="number" id="largePrice">

</div>

<div class="row">

<span>🟩 rectangle Banner</span>

<input type="number" id="rectanglePrice">

</div>

<div class="row">

<span>📱 Mobile Banner</span>

<input type="number" id="mobilePrice">

</div>

<button onclick="savePrices()">

💾 Save Prices

</button>

</div>

<script>

async function loadPrices(){

    const res = await fetch("/api/banner-prices");

    const prices = await res.json();

    document.getElementById("topPrice").value = prices.top;
    document.getElementById("longPrice").value = prices.long;
    document.getElementById("largePrice").value = prices.large;
    document.getElementById("rectanglePrice").value = prices.rectangle;
    document.getElementById("mobilePrice").value = prices.mobile;

}

async function savePrices(){

    const prices = {

        top:Number(document.getElementById("topPrice").value),

        long:Number(document.getElementById("longPrice").value),

        large:Number(document.getElementById("largePrice").value),

        rectangle:Number(document.getElementById("rectanglePrice").value),

        mobile:Number(document.getElementById("mobilePrice").value)

    };

    await fetch("/api/banner-prices",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(prices)

    });

    alert("✅ Banner Prices Updated Successfully");

}

loadPrices();

</script>

</body>

</html>
