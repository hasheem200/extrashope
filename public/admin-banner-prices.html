<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banner Prices</title>


<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

       

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<body>

<header>

<div class="logo">

🏷 Banner Prices

</div>

<nav>

<a href="admin" class="back">
⬅ Back To Admin
</a>

</nav>

</header>

<div class="container">

<h1>Advertisement Prices</h1>

<div class="row">

<span>🏆 Top Leaderboard</span>

<input type="number" id="topPrice">

</div>

<div class="row">

<span>📏 long</span>

<input type="number" id="longPrice">

</div>

<div class="row">

<span>🟨 Large Banner</span>

<input type="number" id="largePrice">

</div>

<div class="row">

<span>🟩 rectangle Banner</span>

<input type="number" id="rectanglePrice">

</div>

<div class="row">

<span>📱 Mobile Banner</span>

<input type="number" id="mobilePrice">

</div>

<button onclick="savePrices()">

💾 Save Prices

</button>

</div>

<script>

async function loadPrices(){

    const res = await fetch("/api/banner-prices");

    const prices = await res.json();

    document.getElementById("topPrice").value = prices.top;
    document.getElementById("longPrice").value = prices.long;
    document.getElementById("largePrice").value = prices.large;
    document.getElementById("rectanglePrice").value = prices.rectangle;
    document.getElementById("mobilePrice").value = prices.mobile;

}

async function savePrices(){

    const prices = {

        top:Number(document.getElementById("topPrice").value),

        long:Number(document.getElementById("longPrice").value),

        large:Number(document.getElementById("largePrice").value),

        rectangle:Number(document.getElementById("rectanglePrice").value),

        mobile:Number(document.getElementById("mobilePrice").value)

    };

    await fetch("/api/banner-prices",{

        method:"PUT",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(prices)

    });

    toast("✅ Banner Prices Updated Successfully");

}

loadPrices();

</script>
