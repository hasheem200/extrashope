<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Profile</title>

<!-- ============================================ -->
<!-- كود يعمل على أي صفحة: Favicon + Site Name in Title -->
<!-- ضع هذا الكود داخل <head> في أي صفحة HTML -->
<!-- ============================================ -->

<title>Loading...</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Shop";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Shop";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
👤 Seller Profile
</div>

<nav>

<a href="/">Home</a>

<a href="notifications">
  🔔 Notifications
</a>

<a href="seller-dashboard">
Dashboard
</a>

</nav>

</header>

<div class="profile-page">

<img class="profile-avatar"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

<h1 id="profileName">
Seller
</h1>

<p id="profileBio">
No bio yet
</p>

<div class="socials">

<p id="profileInstagram"></p>

<p id="profileTelegram"></p>

<p id="profileDiscord"></p>

</div>

<div class="profile-stats">

<div class="profile-box">

<h2 id="profileFollowers">
0
</h2>

<p>Followers</p>

</div>

<div class="profile-box">

<h2 id="profileProducts">
0
</h2>

<p>Products</p>

</div>

<div class="profile-box">

<h2 id="profileRating">
5.0
</h2>

<p>Rating</p>

</div>

</div>

</div>

<a href="notifications">
🔔 <span id="notifCount">0</span>
</a>

<script>

const user =
JSON.parse(localStorage.getItem("user"));

const followers =
localStorage.getItem("followers") || 0;

const products =
JSON.parse(localStorage.getItem("sellerProducts")) || [];

document.getElementById("profileName")
.innerText =
user.nickname;

document.getElementById("profileBio")
.innerText =
user.bio || "Professional Digital Seller 🔥";

document.getElementById("profileInstagram")
.innerHTML =
"📸 Instagram: " +
(user.instagram || "Not Added");

document.getElementById("profileTelegram")
.innerHTML =
"📨 Telegram: " +
(user.telegram || "Not Added");

document.getElementById("profileDiscord")
.innerHTML =
"🎮 Discord: " +
(user.discord || "Not Added");

document.getElementById("profileFollowers")
.innerText =
followers;

document.getElementById("profileProducts")
.innerText =
products.length;

document.getElementById("profileRating")
.innerText =
"5.0";




async function loadNotifCount(){

  const user =
  JSON.parse(
    localStorage.getItem("user")
  );

  if(!user) return;

  const res =
  await fetch(
    "/api/notifications/" +
    user.nickname
  );

  const data =
  await res.json();

  document.getElementById(
    "notifCount"
  ).innerText =
  data.length;

}

loadNotifCount();


</script>

</body>

</html>
