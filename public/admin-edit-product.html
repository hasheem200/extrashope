<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Edit Product</title>

<!-- رابط الـ Favicon الافتراضي -->
<link id="faviconLink" rel="icon" href="/favicon.ico">

<script>
// ============================================
// تطبيق إعدادات الموقع (Favicon + Site Name)
// ============================================
async function applySiteSettings() {
    try {
        // 1. جلب إعدادات الموقع
        const settingsRes = await fetch("/api/settings");
        const settingsData = await settingsRes.json();
        const s = settingsData.siteSettings || {};
        const siteName = s.siteName || "My Site";
        const siteIcon = s.siteIcon || "🛒";
        const favicon = s.favicon || "";

        setSeoTags({
            title: document.title,
            description: s.metaDescription || "",
            siteName: siteName,
            url: (s.siteUrl || window.location.origin) + window.location.pathname
        });

        // 2. تحديث الـ Favicon
        if (favicon) {
            const faviconLink = document.getElementById('faviconLink');
            if (faviconLink) {
                faviconLink.href = favicon;
            } else {
                const link = document.createElement('link');
                link.id = 'faviconLink';
                link.rel = 'icon';
                link.href = favicon;
                document.head.appendChild(link);
            }
        }

        // 3. تحديث عنوان الصفحة (Title)
        // احتفظ بالنص الحالي في الصفحة وأضف اسم الموقع
        const currentTitle = document.title;
        
        // إذا كان العنوان الحالي هو "Loading..." أو فارغاً
        if (currentTitle === "Loading..." || currentTitle === "") {
            document.title = siteName;
        } else {
            // إذا كان العنوان يحتوي بالفعل على اسم الموقع، لا نكرره
            if (!currentTitle.includes(siteName)) {
                document.title = `${currentTitle} - ${siteName}`;
            }
        }

        // 4. تحديث اسم الموقع في الهيدر (اختياري)
        const logoEl = document.querySelector('.logo');
        if (logoEl) {
            if (siteIcon.startsWith('http') || siteIcon.startsWith('/')) {
                logoEl.innerHTML = `<img loading="lazy" src="${siteIcon}" style="height:24px;width:24px;vertical-align:middle;margin-right:8px;"> ${siteName}`;
            } else {
                logoEl.innerHTML = `${siteIcon} ${siteName}`;
            }
        }

        console.log(`✅ Title: ${document.title}`);
        console.log(`✅ Favicon: ${favicon || 'default'}`);

    } catch (error) {
        console.error('❌ Failed to apply settings:', error);
        // في حال الخطأ، استخدم اسم الموقع الافتراضي
        if (document.title === "Loading..." || document.title === "") {
            document.title = "My Site";
        }
    }
}

// تنفيذ عند تحميل الصفحة
document.addEventListener('DOMContentLoaded', applySiteSettings);
</script>

<link rel="stylesheet" href="style.css">

<script src="js/auth-fetch.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/seo.js"></script>
</head>

<body>

<header>

<div class="logo">
🛠 Admin Edit Product
</div>

<nav>

<a href="admin-Products-Manager">
⬅ Back
</a>

</nav>

</header>

<div class="container">

<h1>Edit Product</h1>

<input id="name" placeholder="Product Name">
<br><br>

<input id="price" type="number" placeholder="Price">
<br><br>

<input id="category" placeholder="Category">
<br><br>

<input id="type" placeholder="Type">
<br><br>

<input id="image" placeholder="Image URL">
<br><br>

<textarea
id="download"
placeholder="Download Link"
style="width:100%;height:100px;">
</textarea>

<label style="display:block;margin:10px 0 5px;color:#555;font-size:14px;">
— OR — Upload a new Downloadable File (.zip/.rar/.7z) to replace it
</label>

<input
type="file"
id="downloadFile"
accept=".zip,.rar,.7z">

<br><br>

<hr style="margin:20px 0;border:none;border-top:1px solid #eee;">

<label style="display:block;margin-bottom:5px;color:#555;font-size:14px;">
Showcase Page Details (optional — only needed if this product uses the rich "Template Details" page)
</label>

<input id="version" placeholder="Version (e.g. 1.0.0)">
<br><br>

<input id="liveDemoUrl" placeholder="Live Demo URL">
<br><br>

<textarea
id="screenshots"
placeholder="Admin Panel screenshot URLs, one per line"
style="width:100%;height:100px;">
</textarea>

<br><br>

<button onclick="saveProduct()">
💾 Save Changes
</button>

</div>

<script>

const params =
new URLSearchParams(window.location.search);

const productId =
params.get("id");

let currentProductId = null;

async function loadProduct(){

const res =
await fetch("/api/products");

const products =
await res.json();

const product =
products.find(product =>

product.id == productId

);

if(!product){

toast("Product Not Found");

return;
}

currentProductId =
product._id;

document.getElementById("name").value =
product.name || "";

document.getElementById("price").value =
product.price || "";

document.getElementById("category").value =
product.category || "";

document.getElementById("type").value =
product.type || "";

document.getElementById("image").value =
product.image || "";

document.getElementById("download").value =
product.download || "";

document.getElementById("version").value =
product.version || "";

document.getElementById("liveDemoUrl").value =
product.liveDemoUrl || "";

document.getElementById("screenshots").value =
product.screenshots || "";

}

/* DOWNLOADABLE FILE — upload immediately on selection and
   auto-fill the Download Link field with the resulting URL. */

document.getElementById("downloadFile")
.addEventListener("change", async function(){

const file = this.files[0];

if(!file) return;

const form = new FormData();
form.append("file", file);

if(typeof showLoading === "function") showLoading();

try{

const res = await fetch("/api/upload/download-file", {
    method:"POST",
    body:form
});

const data = await res.json();

if(!res.ok || !data.file){
    toast(data.message || "File upload failed. Please try again.", "error");
    this.value = "";
    return;
}

document.getElementById("download").value = data.file;

toast("File uploaded ✅", "success");

}catch(err){

toast("File upload failed. Please try again.", "error");

this.value = "";

}finally{

if(typeof hideLoading === "function") hideLoading();

}

});

async function saveProduct(){

await fetch(

"/api/products/" + currentProductId,

{
method:"PUT",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

name:
document.getElementById("name").value,

price:
document.getElementById("price").value,

category:
document.getElementById("category").value,

type:
document.getElementById("type").value,

image:
document.getElementById("image").value,

download:
document.getElementById("download").value,

version:
document.getElementById("version").value,

liveDemoUrl:
document.getElementById("liveDemoUrl").value,

screenshots:
document.getElementById("screenshots").value

})

}

);

alert("Product Updated ✅");

window.location.href =
"admin-Products-Manager.html";

}

loadProduct();

</script>
<script src="js/auth.js"></script>

<script>
requireRole("admin");
</script>

</body>
</html>
